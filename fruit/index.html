<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>フルーツキャッチ</title>
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#87CEEB;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    touch-action:none; user-select:none; -webkit-user-select:none; }
  #wrap { position:relative; width:100%; height:100%; }
  canvas { display:block; width:100%; height:100%; }
  #ui { position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column;
    align-items:center; justify-content:center; }
  .panel { pointer-events:auto; background:rgba(255,255,255,.92); border-radius:20px;
    padding:28px 36px; text-align:center; box-shadow:0 8px 30px rgba(0,0,0,.25); max-width:88vw; }
  .panel h1 { font-size:clamp(26px,6vw,40px); color:#e65100; margin-bottom:10px; }
  .panel p { font-size:clamp(14px,3.5vw,17px); color:#444; line-height:1.7; margin-bottom:16px; }
  button { pointer-events:auto; font-family:inherit; font-size:clamp(17px,4.5vw,21px); font-weight:bold;
    color:#fff; background:linear-gradient(180deg,#ff9800,#f57c00); border:none; border-radius:999px;
    padding:13px 38px; cursor:pointer; box-shadow:0 4px 0 #bf360c; }
  button:active { transform:translateY(3px); box-shadow:0 1px 0 #bf360c; }
  .hidden { display:none !important; }
  #score-final { font-size:clamp(20px,5vw,28px); color:#e65100; font-weight:bold; margin-bottom:6px; }
  .paokoCanvas { display:block; margin:0 auto 4px; }
  .paoko-cap { font-size:12px; color:#999; margin-bottom:8px; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="ui">
    <div class="panel" id="startPanel">
      <canvas class="paokoCanvas" width="96" height="112"></canvas>
      <div class="paoko-cap">マスコット：パオこ</div>
      <h1>🍎 フルーツキャッチ</h1>
      <p>カゴを左右に動かして、落ちてくる<br>フルーツをキャッチしよう！<br>
      🍎🍊🍇 は +10点、金の実は +30点。<br>💣 爆弾と 🪨 岩はさけてね。3回当たると終了！<br>制限時間は60秒。</p>
      <button id="startBtn">スタート</button>
    </div>
    <div class="panel hidden" id="endPanel">
      <canvas class="paokoCanvas" width="96" height="112"></canvas>
      <div class="paoko-cap">マスコット：パオこ</div>
      <h1>おつかれさま！</h1>
      <div id="score-final">0点</div>
      <p id="best-line">ベスト: 0点</p>
      <button id="restartBtn">もう一度あそぶ</button>
    </div>
  </div>
</div>
<script>
(function(){
"use strict";
// --- YouTube Playables SDK (optional, fully guarded) ---
var ytReady = false;
function ytCall(fn){ try{ if (typeof ytgame !== "undefined" && ytgame && typeof ytgame[fn] === "function"){ ytgame[fn](); } }catch(e){} }
function ytFirstFrame(){ if(!ytReady){ ytReady = true; ytCall("firstFrameReady"); ytCall("gameReady"); } }

// --- Mascot パオこ (master: ~/workspace/playables/mascot_sprite.js) ---
var PAOKO_W = 24, PAOKO_H = 28;
var PAOKO_PALETTE = {
  "H": "#eceaf4", "h": "#b9b7cc", "S": "#ffe2cf", "E": "#43307a",
  "W": "#ffffff", "c": "#ffb3c8", "m": "#e2607a", "K": "#26232e",
  "R": "#d92b3a", "A": "#f6f3ee", "D": "#3c3a48", "P": "#f8a9c9"
};
var PAOKO_MAP = [
  ".......HHHHHHHHHH.......",
  ".....HHHHHHHHHHHHHH.....",
  "...HHHHHHHHHHHHHHHHHH...",
  "..PPHHHHHHHHHHHHHHHHPP..",
  "..HHHHHHHHHHHHHHHHHHHH..",
  "..HHHHHSSSSSSSSSSHHHHH..",
  "..HHHHHSEESSSSSESHHHHH..",
  "..HHHHHSWESSSSEWSHHHHH..",
  "..HHHHHcSSSSSSSScHHHHH..",
  "..HHHHHSSSSmmSSSSHHHHH..",
  "..HHHHHSSSSSSSSSSHHHHH..",
  "..HHHKKRRKKSSKKRRKKHHH..",
  "..HHHKRKKKKKKKKKKRKHHH..",
  "..HHHRRRRRRRRRRRRRRHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..HHHKKAAADDDDAAAKKHHH..",
  "..HHHKKAAADDRDAAAKKHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..hhhKKAAAAAAAAAAKKhhh..",
  "..hhhKKAAAAAAAAAAKKhhh..",
  "..RRRKKKAAAAAAAAKKKRRR..",
  "..RRRKKKAAAAAAAAKKKRRR..",
  "..RRRKKKKKKKKKKKKKKRRR..",
  "..RRRKRRRRRRRRRRRKRRR...",
  "........KKK..KKK........",
  "........KKK..KKK........"
];
function drawPaoko(ctx, x, y, scale){
  var s = scale || 4;
  for (var r = 0; r < PAOKO_MAP.length; r++){
    var row = PAOKO_MAP[r];
    for (var c = 0; c < row.length; c++){
      var ch = row.charAt(c);
      if (ch === ".") continue;
      var col = PAOKO_PALETTE[ch];
      if (!col) continue;
      ctx.fillStyle = col;
      ctx.fillRect(Math.round(x + c * s), Math.round(y + r * s), Math.ceil(s), Math.ceil(s));
    }
  }
}
function drawPaokoCanvases(){
  var list = document.querySelectorAll(".paokoCanvas");
  for (var i = 0; i < list.length; i++){
    try{
      var g = list[i].getContext("2d");
      if (g){ g.imageSmoothingEnabled = false; drawPaoko(g, 0, 0, 4); }
    }catch(e){}
  }
}
function drawPaokoCorner(){
  // Paoko cheers from the bottom-left corner during play / on the result screen.
  var bob = Math.round(Math.sin(Date.now() / 280) * 2);
  drawPaoko(ctx, 8, H - 60 + bob, 2);
  if (state === STATE.PLAY){
    ctx.fillStyle = "rgba(0,0,0,0.55)"; ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "alphabetic";
    ctx.fillText("がんばれ！", 32, H - 64 + bob);
  }
}

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = Math.floor(W * DPR); canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener("resize", resize); resize();

// --- Audio: WebAudio beeps, created only after a user gesture ---
var audioCtx = null;
function beep(freq, dur, type){
  try{
    if(!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function initAudio(){ try{ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }

// --- Game state ---
var STATE = { MENU:0, PLAY:1, OVER:2 };
var state = STATE.MENU;
var basket = { x: 0, w: 92, h: 26, targetX: 0 };
var items = [];
var score = 0, best = 0, lives = 3, timeLeft = 60, elapsed = 0;
var spawnTimer = 0, lastTs = 0, rafId = null, paused = false;

var FRUITS = [
  { e:"🍎", pts:10 }, { e:"🍊", pts:10 }, { e:"🍇", pts:10 },
  { e:"🍓", pts:10 }, { e:"🍑", pts:10 }, { e:"⭐", pts:30 }
];
function spawn(){
  var r = Math.random();
  var it;
  if (r < 0.16){ it = { e:"💣", kind:"bad" }; }
  else if (r < 0.24){ it = { e:"🪨", kind:"bad" }; }
  else { var f = FRUITS[Math.floor(Math.random()*FRUITS.length)]; it = { e:f.e, kind:"fruit", pts:f.pts }; }
  it.x = 24 + Math.random() * Math.max(10, W - 48);
  it.y = -30;
  it.vy = 170 + Math.random()*140 + elapsed*2.2; // gradually faster
  it.size = 34 + Math.random()*10;
  it.rot = (Math.random()-0.5)*0.6;
  items.push(it);
}
function reset(){
  items = []; score = 0; lives = 3; timeLeft = 60; elapsed = 0; spawnTimer = 0;
  basket.x = W/2; basket.targetX = W/2;
}
function startGame(){
  initAudio(); reset(); state = STATE.PLAY;
  document.getElementById("startPanel").classList.add("hidden");
  document.getElementById("endPanel").classList.add("hidden");
  ytFirstFrame();
}
function endGame(){
  state = STATE.OVER;
  if (score > best) best = score;
  document.getElementById("score-final").textContent = score + "点";
  document.getElementById("best-line").textContent = "ベスト: " + best + "点";
  document.getElementById("endPanel").classList.remove("hidden");
  drawPaokoCanvases();
  beep(220, 0.35, "triangle");
}
document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);

// --- Input: mouse + touch drag (pointer events cover both) ---
function setTarget(clientX){ basket.targetX = Math.max(basket.w/2, Math.min(W - basket.w/2, clientX)); }
canvas.addEventListener("pointermove", function(e){ setTarget(e.clientX); });
canvas.addEventListener("pointerdown", function(e){ setTarget(e.clientX); });
canvas.addEventListener("touchmove", function(e){ if(e.touches.length) setTarget(e.touches[0].clientX); e.preventDefault(); }, { passive:false });

// --- Pause when tab hidden ---
document.addEventListener("visibilitychange", function(){
  paused = document.hidden;
  if (!paused) lastTs = 0; // avoid a huge dt jump on resume
});

// --- Drawing helpers ---
function drawBackground(){
  var g = ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#8fd8ff"); g.addColorStop(0.75,"#d8f5d0"); g.addColorStop(1,"#a8e063");
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "rgba(255,255,255,0.75)";
  var t = elapsed * 12;
  for (var i=0;i<3;i++){
    var cx = ((i*W/3 + t*(0.4+i*0.2)) % (W+160)) - 80, cy = 40 + i*36;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 42, 18, 0, 0, Math.PI*2);
    ctx.ellipse(cx+30, cy+4, 30, 14, 0, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.fillStyle = "#7ec850"; ctx.fillRect(0, H-14, W, 14);
}
function drawBasket(){
  var bx = basket.x - basket.w/2, by = H - 64;
  ctx.fillStyle = "#8d5524";
  ctx.beginPath();
  ctx.moveTo(bx, by); ctx.lineTo(bx + basket.w, by);
  ctx.lineTo(bx + basket.w - 10, by + basket.h); ctx.lineTo(bx + 10, by + basket.h);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#c68642"; ctx.fillRect(bx - 3, by - 6, basket.w + 6, 9);
  ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(bx+8, by+9); ctx.lineTo(bx+basket.w-8, by+9); ctx.stroke();
}
function drawHUD(){
  ctx.fillStyle = "rgba(0,0,0,0.55)";
  ctx.font = "bold 20px sans-serif"; ctx.textAlign = "left";
  ctx.fillText("スコア: " + score, 14, 30);
  ctx.textAlign = "center";
  ctx.fillText("⏱ " + Math.max(0, Math.ceil(timeLeft)) + "秒", W/2, 30);
  ctx.textAlign = "right";
  var hearts = ""; for (var i=0;i<3;i++) hearts += (i < lives ? "❤️" : "🖤");
  ctx.font = "18px sans-serif"; ctx.fillText(hearts, W-12, 30);
  if (best > 0){ ctx.fillStyle = "rgba(0,0,0,0.4)"; ctx.font = "13px sans-serif"; ctx.textAlign = "left"; ctx.fillText("ベスト: " + best, 14, 52); }
}

// --- Main loop ---
function update(dt){
  elapsed += dt; timeLeft = 60 - elapsed;
  if (timeLeft <= 0){ timeLeft = 0; endGame(); return; }
  basket.x += (basket.targetX - basket.x) * Math.min(1, dt * 18);
  spawnTimer -= dt;
  var interval = Math.max(0.34, 0.78 - elapsed * 0.008);
  if (spawnTimer <= 0){ spawn(); spawnTimer = interval; }
  var by = H - 64;
  for (var i = items.length - 1; i >= 0; i--){
    var it = items[i];
    it.y += it.vy * dt;
    if (it.y > by - 6 && it.y < by + 30 && Math.abs(it.x - basket.x) < basket.w/2 + 6){
      if (it.kind === "fruit"){ score += it.pts; beep(it.pts >= 30 ? 1180 : 880, 0.09); }
      else { lives--; beep(140, 0.22, "sawtooth"); if (lives <= 0){ items.splice(i,1); endGame(); return; } }
      items.splice(i,1); continue;
    }
    if (it.y > H + 40) items.splice(i,1);
  }
}
function draw(){
  drawBackground();
  if (state !== STATE.MENU){
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (var i=0;i<items.length;i++){
      var it = items[i];
      ctx.save(); ctx.translate(it.x, it.y); ctx.rotate(it.rot * Math.sin(it.y*0.02));
      ctx.font = it.size + "px sans-serif"; ctx.fillText(it.e, 0, 0); ctx.restore();
    }
    drawBasket();
    drawPaokoCorner();
    if (state === STATE.PLAY) drawHUD();
  }
  if (paused && state === STATE.PLAY){
    ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "#fff"; ctx.font = "bold 28px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("一時停止中", W/2, H/2);
  }
}
function loop(ts){
  rafId = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts;
  var dt = Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
  if (!paused && state === STATE.PLAY) update(dt);
  draw();
}
rafId = requestAnimationFrame(loop);
drawPaokoCanvases();
ytFirstFrame();
})();
</script>
</body>
</html>
