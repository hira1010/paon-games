<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>パオリンブロックパズル</title>
<script src="https://www.youtube.com/game_api/v1"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:#2b1a2e; height:100%; overflow:hidden; }
  #wrap { position:relative; width:100%; max-width:480px; height:100%; margin:0 auto;
    background:linear-gradient(180deg,#3d2340 0%,#2b1a2e 55%,#241327 100%); }
  canvas { display:block; width:100%; touch-action:none; }
  .btn { position:absolute; left:50%; transform:translateX(-50%);
    font-family:"Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif; font-weight:bold;
    color:#fff; background:#e2607a; border:3px solid #fff; border-radius:999px;
    padding:12px 34px; font-size:20px; cursor:pointer; box-shadow:0 4px 0 #a83a52; }
  .btn:active { transform:translateX(-50%) translateY(3px); box-shadow:0 1px 0 #a83a52; }
  #startBtn { bottom:26px; }
  #restartBtn { bottom:26px; display:none; }
  #muteBtn { position:absolute; top:10px; right:10px; width:40px; height:40px;
    border-radius:50%; border:2px solid #fff; background:#5b3a63; color:#fff;
    font-size:18px; cursor:pointer; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="480" height="760"></canvas>
  <button id="muteBtn" title="音のオン/オフ">♪</button>
  <button class="btn" id="startBtn">スタート</button>
  <button class="btn" id="restartBtn">もういちど</button>
</div>
<script>
// ============================================================
// パオリンブロックパズル (Game #4)
// Block Blast系：8x8グリッドにブロックを置き、行・列をそろえて消す
// 完全オリジナル（桜・和風テーマ）。タッチ＋マウス対応。
// YouTube Playables SDK は任意・完全ガード付き。
// ============================================================

// --- YouTube Playables SDK (optional, fully guarded) ---
function ytCall(fn){ try{ if (typeof ytgame !== "undefined" && ytgame && typeof ytgame[fn] === "function"){ ytgame[fn](); } }catch(e){} }

var canvas = document.getElementById("game");
var ctx = canvas.getContext("2d");
var W = 480, H = 760;

// --- Paorin sprite (master: ~/workspace/playables/mascot_sprite.js, inlined) ---
var PAOKO_W = 24, PAOKO_H = 28;
var PAOKO_PALETTE = {
  "H": "#eceaf4", "h": "#b9b7cc", "S": "#ffe2cf", "E": "#43307a", "W": "#ffffff",
  "c": "#ffb3c8", "m": "#e2607a", "K": "#26232e", "R": "#d92b3a", "A": "#f6f3ee",
  "D": "#3c3a48", "P": "#f8a9c9"
};
var PAOKO_MAP = [
  ".......HHHHHHHHHH.......",
  ".....HHHHHHHHHHHHHH.....",
  "...HHHHHHHHHHHHHHHHHH...",
  "..PPHHHHHHHHHHHHHHHHPP..",
  "..HHHHHHHHHHHHHHHHHHHH..",
  "..HHHHHSSSSSSSSSSHHHHH..",
  "..HHHHHSEESSSSSESHHHHH..",
  "..HHHHHSWESSSSEWSHHHHH..",
  "..HHHHHcSSSSSSSScHHHHH..",
  "..HHHHHSSSSmmSSSSHHHHH..",
  "..HHHHHSSSSSSSSSSHHHHH..",
  "..HHHKKRRKKSSKKRRKKHHH..",
  "..HHHKRKKKKKKKKKKRKHHH..",
  "..HHHRRRRRRRRRRRRRRHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..HHHKKAAADDDDAAAKKHHH..",
  "..HHHKKAAADDRDAAAKKHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..HHHKKAAAAAAAAAAKKHHH..",
  "..hhhKKAAAAAAAAAAKKhhh..",
  "..hhhKKAAAAAAAAAAKKhhh..",
  "..RRRKKKAAAAAAAAKKKRRR..",
  "..RRRKKKAAAAAAAAKKKRRR..",
  "..RRRKKKKKKKKKKKKKKRRR..",
  "..RRRKRRRRRRRRRRRKRRR...",
  "........KKK..KKK........",
  "........KKK..KKK........"
];
function drawPaoko(c, x, y, scale){
  var s = scale || 4;
  for (var r = 0; r < PAOKO_MAP.length; r++){
    var row = PAOKO_MAP[r];
    for (var cc = 0; cc < row.length; cc++){
      var ch = row.charAt(cc);
      if (ch === ".") continue;
      var col = PAOKO_PALETTE[ch];
      if (!col) continue;
      c.fillStyle = col;
      c.fillRect(Math.round(x + cc * s), Math.round(y + r * s), Math.ceil(s), Math.ceil(s));
    }
  }
}

// --- Audio (WebAudio, no external files) ---
var audioCtx = null, muted = false;
function initAudio(){ try{ if(!audioCtx){ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){} }
function beep(freq, dur, type, vol){
  if (muted) return;
  try{
    initAudio(); if(!audioCtx) return;
    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type || "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  }catch(e){}
}
function sfxPlace(){ beep(440, 0.08, "triangle", 0.10); }
function sfxClear(n){ var i; for(i=0;i<Math.min(n,4);i++){ setTimeout(function(f){ return function(){ beep(f,0.12,"sine",0.12); }; }(523+i*131), i*70); } }
function sfxLevel(){ [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){ beep(f,0.15,"sine",0.12); }, i*90); }); }
function sfxOver(){ [392,330,262,196].forEach(function(f,i){ setTimeout(function(){ beep(f,0.2,"triangle",0.10); }, i*120); }); }
function sfxBad(){ beep(160, 0.12, "square", 0.06); }

// --- Board ---
var GRID = 8, CELL = 44, GAP = 2;
var GX = 57, GY = 96;              // grid top-left
var GRID_PX = GRID*CELL + (GRID-1)*GAP; // 366
var TRAY_Y = 500, TRAY_H = 120;    // tray area
var TRAY_CELL = 26;

var COLORS = ["#f7a8c4","#e2607a","#f2c14e","#4ec9b0","#9b7ede","#6aa9e9","#7ec850","#f2994a"];
// shapes: list of [cells[[r,c]...], weight]
var SHAPES = [
  { cells:[[0,0]], w:6 },                       // 1
  { cells:[[0,0],[0,1]], w:6 },                 // 2横
  { cells:[[0,0],[1,0]], w:6 },                 // 2縦
  { cells:[[0,0],[0,1],[0,2]], w:5 },           // 3横
  { cells:[[0,0],[1,0],[2,0]], w:5 },           // 3縦
  { cells:[[0,0],[0,1],[0,2],[0,3]], w:3 },     // 4横
  { cells:[[0,0],[1,0],[2,0],[3,0]], w:3 },     // 4縦
  { cells:[[0,0],[0,1],[1,0],[1,1]], w:5 },     // 2x2
  { cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2]], w:2 }, // 3x3
  { cells:[[0,0],[1,0],[1,1]], w:4 },           // L
  { cells:[[0,0],[0,1],[1,1]], w:4 },           // L2
  { cells:[[0,1],[1,0],[1,1]], w:4 },           // L3
  { cells:[[0,0],[0,1],[1,0]], w:4 },           // L4
  { cells:[[0,0],[0,1],[0,2],[1,1]], w:3 },     // T
  { cells:[[0,1],[1,0],[1,1],[1,2]], w:3 },     // T下
  { cells:[[0,0],[0,1],[1,0],[1,1],[2,0],[2,1]], w:3 }, // 3x2
  { cells:[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2]], w:3 }  // 2x3
];

var state = "title"; // title | play | over
var grid = [];       // GRID x GRID, 0 or color index+1
var tray = [];       // 3 pieces {shape, color, used, slotX, slotY, w, h}
var score = 0, best = 0, combo = 0, totalLines = 0, level = 1;
var dragging = null; // {pi, dx, dy, gx, gy, ok}
var selected = -1;   // tapped piece index (tap-to-place fallback)
var particles = [];
var paorinMsg = "がんばれ！", paorinMsgT = 0;
var clearFlash = null; // {rows:[], cols:[], t:0}
var shakeT = 0;

try{ best = parseInt(localStorage.getItem("paorin_block_best") || "0", 10) || 0; }catch(e){ best = 0; }

function newGrid(){ var g=[],r,c; for(r=0;r<GRID;r++){ g.push([]); for(c=0;c<GRID;c++) g[r].push(0); } return g; }
function shapeSize(shape){ var mr=0,mc=0,i; for(i=0;i<shape.cells.length;i++){ mr=Math.max(mr,shape.cells[i][0]); mc=Math.max(mc,shape.cells[i][1]); } return {rows:mr+1, cols:mc+1}; }
function pickShape(){
  var total=0,i; for(i=0;i<SHAPES.length;i++) total+=SHAPES[i].w;
  var r=Math.random()*total;
  for(i=0;i<SHAPES.length;i++){ r-=SHAPES[i].w; if(r<=0) return SHAPES[i]; }
  return SHAPES[0];
}
function refillTray(){
  tray = [];
  var slotW = W/3, i;
  for(i=0;i<3;i++){
    var s = pickShape(), sz = shapeSize(s);
    tray.push({ shape:s, color:1+Math.floor(Math.random()*COLORS.length),
      used:false, slot:i, cx: slotW*i + slotW/2, cy: TRAY_Y + TRAY_H/2,
      pw: sz.cols*(TRAY_CELL+2)-2, ph: sz.rows*(TRAY_CELL+2)-2, rows:sz.rows, cols:sz.cols });
  }
  selected = -1;
}
function canPlace(pi, gr, gc){
  var p = tray[pi]; if(!p || p.used) return false;
  var i, r, c;
  for(i=0;i<p.shape.cells.length;i++){
    r = gr + p.shape.cells[i][0]; c = gc + p.shape.cells[i][1];
    if(r<0||r>=GRID||c<0||c>=GRID||grid[r][c]!==0) return false;
  }
  return true;
}
function anyFits(){
  var pi,r,c;
  for(pi=0;pi<tray.length;pi++){
    if(tray[pi].used) continue;
    for(r=0;r<GRID;r++) for(c=0;c<GRID;c++) if(canPlace(pi,r,c)) return true;
  }
  return false;
}
function placePiece(pi, gr, gc){
  var p = tray[pi];
  var i, r, c;
  for(i=0;i<p.shape.cells.length;i++){
    r = gr + p.shape.cells[i][0]; c = gc + p.shape.cells[i][1];
    grid[r][c] = p.color;
  }
  p.used = true;
  score += p.shape.cells.length * 10;
  sfxPlace();
  // find full rows / cols
  var rows=[], cols=[];
  for(r=0;r<GRID;r++){ var full=true; for(c=0;c<GRID;c++) if(grid[r][c]===0){ full=false; break; } if(full) rows.push(r); }
  for(c=0;c<GRID;c++){ var full2=true; for(r=0;r<GRID;r++) if(grid[r][c]===0){ full2=false; break; } if(full2) cols.push(c); }
  var lines = rows.length + cols.length;
  if(lines>0){
    combo++;
    var bonus = 100*lines*combo + 50*lines*(level-1);
    score += bonus;
    totalLines += lines;
    var newLevel = 1 + Math.floor(totalLines/6);
    spawnClearParticles(rows, cols);
    clearFlash = { rows:rows, cols:cols, t:0 };
    setTimeout(function(){ clearCells(rows, cols); clearFlash=null; }, 220);
    sfxClear(lines);
    paorinMsg = combo>=2 ? "コンボ"+combo+"！すごい！" : "きれいに消えた！";
    paorinMsgT = 180;
    if(newLevel>level){ level=newLevel; sfxLevel(); paorinMsg="レベルアップ！"; paorinMsgT=240; }
  } else {
    combo = 0;
  }
  // refill when all used
  var allUsed = tray.every(function(t){ return t.used; });
  if(allUsed){ refillTray(); }
  // game over check (after possible refill, slight delay so clear animation reads)
  setTimeout(function(){
    if(state!=="play") return;
    if(!anyFits()){ gameOver(); }
  }, 260);
}
function clearCells(rows, cols){
  var i,r,c;
  for(i=0;i<rows.length;i++){ r=rows[i]; for(c=0;c<GRID;c++) grid[r][c]=0; }
  for(i=0;i<cols.length;i++){ c=cols[i]; for(r=0;r<GRID;r++) grid[r][c]=0; }
}
function spawnClearParticles(rows, cols){
  var i,r,c,k;
  function burst(r,c){
    var col = grid[r][c] ? COLORS[grid[r][c]-1] : "#ffffff";
    for(k=0;k<3;k++){
      particles.push({ x: GX+c*(CELL+GAP)+CELL/2, y: GY+r*(CELL+GAP)+CELL/2,
        vx:(Math.random()-0.5)*260, vy:(Math.random()-0.9)*220, life:0.6+Math.random()*0.3, col:col });
    }
  }
  for(i=0;i<rows.length;i++){ r=rows[i]; for(c=0;c<GRID;c++) burst(r,c); }
  for(i=0;i<cols.length;i++){ c=cols[i]; for(r=0;r<GRID;r++) if(rows.indexOf(r)<0) burst(r,c); }
}
function gameOver(){
  state = "over";
  sfxOver();
  paorinMsg = "つぎはがんばろう！";
  paorinMsgT = 9999;
  if(score>best){
    best = score;
    try{ localStorage.setItem("paorin_block_best", String(best)); }catch(e){}
  }
  document.getElementById("restartBtn").style.display = "block";
  try{ ytCall("gameOver"); }catch(e){}
}
function startGame(){
  initAudio();
  grid = newGrid();
  score = 0; combo = 0; totalLines = 0; level = 1;
  particles = []; clearFlash = null; dragging = null;
  paorinMsg = "がんばれ！"; paorinMsgT = 9999;
  refillTray();
  state = "play";
  document.getElementById("startBtn").style.display = "none";
  document.getElementById("restartBtn").style.display = "none";
  try{ ytCall("gameStart"); }catch(e){}
}

// --- Input (pointer: mouse + touch) ---
function toCanvas(e){
  var rect = canvas.getBoundingClientRect();
  return { x:(e.clientX-rect.left)*(W/rect.width), y:(e.clientY-rect.top)*(H/rect.height) };
}
function trayHit(x, y){
  var i, p;
  for(i=0;i<tray.length;i++){
    p = tray[i]; if(p.used) continue;
    if(x>=p.cx-p.pw/2-14 && x<=p.cx+p.pw/2+14 && y>=p.cy-p.ph/2-14 && y<=p.cy+p.ph/2+14) return i;
  }
  return -1;
}
function gridCellFromPoint(x, y){
  var c = Math.floor((x-GX)/(CELL+GAP)), r = Math.floor((y-GY)/(CELL+GAP));
  if(r<0||r>=GRID||c<0||c>=GRID) return null;
  return { r:r, c:c };
}
canvas.addEventListener("pointerdown", function(e){
  e.preventDefault();
  initAudio();
  if(state!=="play") return;
  var pt = toCanvas(e);
  // tap-to-place: a piece is selected and user taps the grid
  if(selected>=0){
    var cell = gridCellFromPoint(pt.x, pt.y);
    if(cell){
      var p = tray[selected], sz = p;
      var gr = cell.r - Math.floor(p.rows/2), gc = cell.c - Math.floor(p.cols/2);
      if(canPlace(selected, gr, gc)){ placePiece(selected, gr, gc); selected=-1; return; }
      sfxBad(); selected=-1; return;
    }
  }
  var pi = trayHit(pt.x, pt.y);
  if(pi>=0){
    var p2 = tray[pi];
    dragging = { pi:pi, dx: pt.x-(p2.cx-p2.pw/2), dy: pt.y-(p2.cy-p2.ph/2), gx:null, gy:null, ok:false, moved:false };
    selected = pi;
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
  }
});
canvas.addEventListener("pointermove", function(e){
  if(!dragging || state!=="play") return;
  var pt = toCanvas(e);
  var p = tray[dragging.pi];
  if(Math.abs(pt.x-(p.cx))>8 || Math.abs(pt.y-(p.cy))>8) dragging.moved = true;
  // anchor: pointer maps to the piece cell under the pointer
  var cell = gridCellFromPoint(pt.x, pt.y);
  if(cell){
    // convert grab offset (tray px) to grid-cell units
    var offR = Math.floor((dragging.dy * (CELL/TRAY_CELL)) / (CELL+GAP));
    var offC = Math.floor((dragging.dx * (CELL/TRAY_CELL)) / (CELL+GAP));
    dragging.gx = cell.r - offR; dragging.gy = cell.c - offC;
    dragging.ok = canPlace(dragging.pi, dragging.gx, dragging.gy);
  } else { dragging.gx = null; dragging.gy = null; dragging.ok = false; }
});
canvas.addEventListener("pointerup", function(e){
  if(!dragging) return;
  var d = dragging; dragging = null;
  if(state!=="play") return;
  if(d.gx!==null && d.ok){ placePiece(d.pi, d.gx, d.gy); selected=-1; }
  // if it was a simple tap on the tray piece, keep it selected for tap-to-place
  else if(!d.moved){ selected = d.pi; }
  else { selected = -1; }
});
canvas.addEventListener("pointercancel", function(){ dragging=null; selected=-1; });

document.getElementById("startBtn").addEventListener("click", startGame);
document.getElementById("restartBtn").addEventListener("click", startGame);
document.getElementById("muteBtn").addEventListener("click", function(){
  muted = !muted;
  this.textContent = muted ? "✕" : "♪";
});
document.addEventListener("visibilitychange", function(){
  if(document.hidden){ try{ ytCall("gamePause"); }catch(e){} }
});

// --- Drawing ---
function roundRect(c,x,y,w,h,r){
  c.beginPath();
  c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}
function drawPiece(c, p, ox, oy, cell, alpha, ghostOk){
  var pitch = cell + GAP;
  var i, r, cc, x, y;
  c.save();
  if(alpha!==undefined) c.globalAlpha = alpha;
  for(i=0;i<p.shape.cells.length;i++){
    r = p.shape.cells[i][0]; cc = p.shape.cells[i][1];
    x = ox + cc*pitch; y = oy + r*pitch;
    c.fillStyle = ghostOk===false ? "#c0392b" : COLORS[p.color-1];
    roundRect(c, x, y, cell, cell, 7);
    c.fill();
    c.fillStyle = "rgba(255,255,255,0.25)";
    roundRect(c, x+3, y+3, cell-6, cell*0.32, 5);
    c.fill();
  }
  c.restore();
}
function draw(){
  ctx.clearRect(0,0,W,H);
  // background deco: sakura petals
  ctx.save();
  ctx.fillStyle = "rgba(248,169,201,0.10)";
  var i;
  for(i=0;i<10;i++){
    var px = (i*97)%W, py = (i*173)%H;
    ctx.beginPath(); ctx.arc(px, py, 5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // header
  ctx.textAlign = "center";
  ctx.fillStyle = "#f6f3ee";
  ctx.font = "bold 20px 'Hiragino Sans', sans-serif";
  ctx.fillText("パオリンブロックパズル", W/2, 30);
  ctx.font = "bold 26px 'Hiragino Sans', sans-serif";
  ctx.fillStyle = "#ffd166";
  ctx.textAlign = "left";
  ctx.fillText("スコア " + score, 20, 66);
  ctx.textAlign = "right";
  ctx.fillStyle = "#f6f3ee";
  ctx.font = "bold 16px 'Hiragino Sans', sans-serif";
  ctx.fillText("ベスト " + best, W-58, 60);
  ctx.fillText("レベル " + level + (combo>=2 ? "  コンボ×" + combo : ""), W-58, 82);

  // grid board
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  roundRect(ctx, GX-10, GY-10, GRID_PX+20, GRID_PX+20, 14); ctx.fill();
  var r, c;
  for(r=0;r<GRID;r++) for(c=0;c<GRID;c++){
    var x = GX+c*(CELL+GAP), y = GY+r*(CELL+GAP);
    var flashing = clearFlash && (clearFlash.rows.indexOf(r)>=0 || clearFlash.cols.indexOf(c)>=0);
    if(grid[r][c]!==0){
      ctx.fillStyle = flashing ? "#ffffff" : COLORS[grid[r][c]-1];
      roundRect(ctx, x, y, CELL, CELL, 7); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.25)";
      roundRect(ctx, x+3, y+3, CELL-6, CELL*0.32, 5); ctx.fill();
    } else {
      ctx.fillStyle = flashing ? "rgba(255,255,255,0.5)" : "rgba(255,255,255,0.07)";
      roundRect(ctx, x, y, CELL, CELL, 7); ctx.fill();
    }
  }

  // ghost preview while dragging
  if(dragging && dragging.gx!==null && state==="play"){
    var p = tray[dragging.pi];
    ctx.save();
    ctx.globalAlpha = 0.55;
    drawPiece(ctx, p, GX+dragging.gy*(CELL+GAP), GY+dragging.gx*(CELL+GAP), CELL, 1, dragging.ok);
    ctx.restore();
  }

  // tray
  ctx.fillStyle = "rgba(0,0,0,0.30)";
  roundRect(ctx, 16, TRAY_Y-8, W-32, TRAY_H+16, 14); ctx.fill();
  for(i=0;i<tray.length;i++){
    var tp = tray[i];
    if(tp.used) continue;
    if(dragging && dragging.pi===i) continue; // dragged piece drawn at pointer
    var ox = tp.cx - tp.pw/2, oy = tp.cy - tp.ph/2;
    if(selected===i){
      ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 3;
      roundRect(ctx, ox-10, oy-10, tp.pw+20, tp.ph+20, 10); ctx.stroke();
    }
    drawPiece(ctx, tp, ox, oy, TRAY_CELL, 1, true);
  }
  // dragged piece follows pointer (drawn at pointer pos, centered on grab offset)
  if(dragging && state==="play"){
    var dp = tray[dragging.pi];
    // use last pointer pos stored via ghost cell: draw at grid if over grid, else at pointer
    // (pointer pos tracked in dragging.px/py)
    if(dragging.px!==undefined){
      var dw = dp.cols*(CELL+GAP), dh = dp.rows*(CELL+GAP);
      drawPiece(ctx, dp, dragging.px-dragging.dx*(CELL/TRAY_CELL), dragging.py-dragging.dy*(CELL/TRAY_CELL), CELL, 0.9, true);
    }
  }

  // Paorin cheering (bottom-left)
  var bob = Math.sin(Date.now()/400)*3;
  drawPaoko(ctx, 16, 668+bob, 2);
  // speech bubble
  ctx.fillStyle = "#fff";
  roundRect(ctx, 72, 672, 190, 44, 12); ctx.fill();
  ctx.beginPath(); ctx.moveTo(72,692); ctx.lineTo(58,700); ctx.lineTo(72,706); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#43307a";
  ctx.font = "bold 16px 'Hiragino Sans', sans-serif";
  ctx.textAlign = "left";
  ctx.fillText(paorinMsg, 84, 700);
  // hint
  ctx.fillStyle = "rgba(246,243,238,0.65)";
  ctx.font = "13px 'Hiragino Sans', sans-serif";
  ctx.fillText("ドラッグで置く・タップで選んで置く", 16, 748);

  // particles
  for(i=particles.length-1;i>=0;i--){
    var pt2 = particles[i];
    ctx.globalAlpha = Math.max(0, pt2.life);
    ctx.fillStyle = pt2.col;
    ctx.fillRect(pt2.x-3, pt2.y-3, 6, 6);
  }
  ctx.globalAlpha = 1;

  // title / game over overlays
  if(state==="title"){
    ctx.fillStyle = "rgba(20,8,24,0.72)";
    ctx.fillRect(0,0,W,H);
    drawPaoko(ctx, W/2-24*4/2, 150, 4);
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 34px 'Hiragino Sans', sans-serif";
    ctx.fillText("パオリンブロック", W/2, 320);
    ctx.fillText("パズル", W/2, 362);
    ctx.fillStyle = "#f6f3ee";
    ctx.font = "16px 'Hiragino Sans', sans-serif";
    ctx.fillText("ブロックをドラッグして 8×8 に置こう", W/2, 410);
    ctx.fillText("行・列がそろうと消えてスコアアップ！", W/2, 436);
    ctx.fillText("置ける場所がなくなったらゲームオーバー", W/2, 462);
    ctx.fillStyle = "#f8a9c9";
    ctx.font = "bold 15px 'Hiragino Sans', sans-serif";
    ctx.fillText("パオリンと一緒にあそぼう♪", W/2, 500);
  }
  if(state==="over"){
    ctx.fillStyle = "rgba(20,8,24,0.72)";
    ctx.fillRect(0,0,W,H);
    drawPaoko(ctx, W/2-24*4/2, 130, 4);
    ctx.textAlign = "center";
    ctx.fillStyle = "#f6f3ee";
    ctx.font = "bold 30px 'Hiragino Sans', sans-serif";
    ctx.fillText("ゲームオーバー", W/2, 300);
    ctx.fillStyle = "#ffd166";
    ctx.font = "bold 26px 'Hiragino Sans', sans-serif";
    ctx.fillText("スコア " + score, W/2, 350);
    ctx.fillStyle = "#f6f3ee";
    ctx.font = "18px 'Hiragino Sans', sans-serif";
    ctx.fillText("ベスト " + best + "　レベル " + level + "　消した列 " + totalLines, W/2, 386);
    ctx.fillStyle = "#f8a9c9";
    ctx.font = "bold 16px 'Hiragino Sans', sans-serif";
    ctx.fillText("パオリン「つぎはがんばろう！」", W/2, 424);
  }
}

// track pointer pos for dragged piece drawing
(function(){
  var origMove = canvas.addEventListener;
  canvas.addEventListener("pointermove", function(e){
    if(dragging){
      var pt = toCanvas(e);
      dragging.px = pt.x; dragging.py = pt.y;
    }
  });
})();

function loop(){
  // particles update
  var i, dt = 1/60;
  for(i=particles.length-1;i>=0;i--){
    var p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 420*dt; p.life -= dt;
    if(p.life<=0) particles.splice(i,1);
  }
  if(paorinMsgT>0 && paorinMsgT<9000){ paorinMsgT--; if(paorinMsgT===0 && state==="play") paorinMsg="がんばれ！"; }
  if(clearFlash){ clearFlash.t++; }
  draw();
  requestAnimationFrame(loop);
}
grid = newGrid();
refillTray();
loop();

// --- QA hook (harmless in production) ---
window.__qa = {
  state: function(){ return { state:state, score:score, best:best, level:level, combo:combo,
    tray: tray.map(function(t){ return {used:t.used, rows:t.rows, cols:t.cols}; }),
    filled: grid.reduce(function(a,row){ return a+row.filter(function(v){return v!==0;}).length; },0) }; },
  place: function(pi, r, c){ if(state==="play" && canPlace(pi,r,c)){ placePiece(pi,r,c); return true; } return false; },
  fillForGameOver: function(){ var r,c; for(r=0;r<GRID;r++) for(c=0;c<GRID;c++) grid[r][c]=1; for(c=0;c<GRID;c++) grid[0][c]=0; },
  start: startGame
};
</script>
